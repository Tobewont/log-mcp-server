apiVersion: v1
kind: ConfigMap
metadata:
  name: log-mcp-server-config
  namespace: log-mcp
  labels:
    app.kubernetes.io/name: log-mcp-server
data:
  # ---- 后端选择 --------------------------------------------------------
  LOG_BACKEND: "loki"

  # ---- Loki 连接 -------------------------------------------------------
  # 单 Loki："http://loki:3100"
  # 多 Loki（Thanos 风格扇出）：用 | 分隔多个地址。
  # 配置的租户会在每个集群上并发查询。
  LOKI_ADDR: "http://loki.observability.svc.cluster.local:3100"
  LOKI_TENANTS: "fake"
  LOKI_TLS_SKIP_VERIFY: "false"
  LOKI_CONNECT_TIMEOUT: "10.0"
  LOKI_READ_TIMEOUT: "15.0"

  # ---- 进程级客户端租户范围（仅 stdio 模式 fallback） -------------------
  # HTTP 模式（k8s 默认）下每次请求都必须携带 X-Allowed-Tenants 请求头，
  # 否则查询/下载工具直接拒绝；本环境变量只在容器以 stdio 模式运行
  # （例如 mcp.json 的 'command' 形式）时生效，HTTP 部署可以不设。
  #
  # 提示：只列出实际需要的租户。未显式传 tenant= 时工具会并发查询
  # 这里列出的所有租户，配的越多越慢、噪声越大、结果越不精准。
  # LOKI_CLIENT_TENANTS: "team-a,team-b"

  # ---- 健康检查缓存（仅多集群生效）------------------------------------
  # 仅当 LOKI_ADDR 包含多个用 | 分隔的地址时使用。
  HEALTH_CHECK_INTERVAL: "300"
  HEALTH_CHECK_TIMEOUT: "5"

  # ---- 通用查询 / 时间相关参数 ----------------------------------------
  LOG_DEFAULT_LIMIT: "100"
  LOG_MAX_LIMIT: "5000"
  LOG_DEFAULT_TIME_RANGE_MINUTES: "30"
  LOG_TIMEZONE: "Asia/Shanghai"
  LOG_LEVEL: "INFO"

  # ---- 返回体瘦身（query_logs 输出详略程度）--------------------------
  # query_logs 默认详略档位：compact（默认）/ normal / full。
  #   * compact —— 只输出日志正文，一行一条；token 开销最低。
  #   * normal  —— 正文 + 短格式时间 + 差异标签，公共标签提到头部。
  #   * full    —— 完整格式（Entry 头 + 纳秒时间 + 全量标签）。
  LOG_DEFAULT_VERBOSITY: "compact"
  # compact / normal 单条日志行最大字符数，超过截断（full 不截断）。
  LOG_MAX_LINE_CHARS: "2000"
  # compact 模式是否折叠连续同模板重复行（≥3 条折叠为一条并标 ×N）。
  LOG_FOLD_REPEATS: "true"
  # compact / normal 是否剥离正文中的 ANSI 颜色码（零信息损失，full 不剥离）。
  LOG_STRIP_ANSI: "true"
  # compact 折叠作用域：adjacent（默认，只折连续行，不打乱时序）/
  # global（全窗口按模板聚类，省 token 最多但属有损概览）。
  # 两者都不会折叠 WARNING / ERROR / CRITICAL 行。
  LOG_FOLD_SCOPE: "adjacent"
  # query_logs 未显式传 exclude_loggers 时默认排除的 logger 名（逗号分隔）。
  # 默认空 = 开箱不排除任何 logger（"隐藏内容"必须由用户主动选择）。
  # 支持 fnmatch 通配；WARNING / ERROR / CRITICAL 行与解析不出 logger 的行
  # 永不被排除；full 模式不生效。
  # LOG_DEFAULT_EXCLUDE_LOGGERS: "httpcore.*,uvicorn.protocols.http.h11_impl"
  # normal 模式下是否去掉正文开头与行首重复的时间戳（仅 normal 生效；
  # compact 行首没有时间，恒不去重；full 不处理）。
  LOG_DEDUP_TIMESTAMP: "false"
  # ---- A 档「零信息损失」正文瘦身（默认全开，full 模式一律不生效）------
  # 三项都不丢排查信息（时分秒 / 级别 / 模块名 / 行号 / 业务 ID / HTTP 状态码 /
  # 堆栈缩进全部完好），被提取或省略的内容都会在返回体头部标注一次。
  # 所有输出行的最长公共前缀（≥8 字符）提到头部只输出一次（compact / normal）。
  LOG_HOIST_COMMON_PREFIX: "true"
  # 行内连续 ≥2 个空格压成 1 个（只处理空格，tab 不碰）；行首缩进原样
  # 保留（compact / normal）。
  LOG_COLLAPSE_WHITESPACE: "true"
  # 省略正文开头重复的 "YYYY-MM-DD " 日期，时分秒一定保留（仅 compact；
  # 跨天时整批禁用）。
  LOG_HOIST_COMMON_DATE: "true"
  # download_logs 未显式传 fmt 时的默认格式：txt（已瘦身）/ jsonl / csv。
  LOG_DEFAULT_DOWNLOAD_FORMAT: "txt"

  # ---- MCP 传输 -------------------------------------------------------
  # 推荐使用 streamable-http。
  MCP_TRANSPORT: "streamable-http"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8000"
  # streamable-http 传输挂载的 URL 路径前缀（必须以 / 开头）。
  # SSE / stdio 不受此配置影响。便于和其它 MCP 服务统一规划
  # Ingress 路径。
  MCP_PATH: "/mcp"

  # ---- 日志下载（download_logs 工具）---------------------------------
  # 工具把可下载文件写到这个目录下，服务端通过
  # <MCP 路径前缀>/download/<token> 路由对外提供。
  #
  # 路径要求（必须可写）：
  # * deployment.yaml 设置了 readOnlyRootFilesystem=true，仅把 /tmp
  #   挂载为 emptyDir。默认值放在 /tmp 内可开箱即用；如果需要独立
  #   volume，请在 deployment.yaml 里挂载，并把此值改为对应路径。
  LOG_DOWNLOAD_DIR: "/tmp/log-mcp-downloads"
  # 下载令牌 / 文件存活时间（秒）。如果业务方常常隔很久才点链接，
  # 可适当调大。
  LOG_DOWNLOAD_TTL_SECONDS: "3600"
  # 用于渲染下载链接的对外 base URL。在 Ingress / 反向代理改写 Host
  # 时显式设置；否则服务端会按请求自身的 Host header 推断。
  # LOG_DOWNLOAD_BASE_URL: "https://logs-mcp.example.com"
